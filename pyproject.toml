[project]
name = "agentic-commerce"
version = "0.1.0"
description = "AI-Native Agentic Commerce for Merchants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "google-genai>=0.2.2",
    "razorpay>=1.4.1",
    "rich>=13.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
